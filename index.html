<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placar Miyamoto Damashii - v1.1</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --panel-bg: #1f2833;
            --aka-color: #ff2a2a;
            --aka-bg: #3d0c0c;
            --shiro-color: #ffffff;
            --shiro-bg: #2a343d;
            --text-gold: #ffcc00;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: white;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            margin: 0;
            font-size: 3rem;
            letter-spacing: 3px;
            color: var(--text-gold);
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.4);
        }

        .version-badge {
            font-size: 1rem;
            color: #aaa;
            margin-top: 5px;
            font-weight: bold;
        }

        /* Layout do Placar */
        .scoreboard {
            display: grid;
            grid-template-columns: 1fr 340px 1fr;
            gap: 20px;
            width: 100%;
            max-width: 1300px;
            margin-bottom: 20px;
        }

        .competitor-card {
            border-radius: 16px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 6px 20px rgba(0,0,0,0.7);
            position: relative;
        }

        /* Destaques para Aka e Shiro */
        .aka-side {
            background-color: var(--aka-bg);
            border: 4px solid var(--aka-color);
            box-shadow: 0 0 20px rgba(255, 42, 42, 0.3);
        }

        .shiro-side {
            background-color: var(--shiro-bg);
            border: 4px solid var(--shiro-color);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }

        .side-label {
            font-size: 2.2rem;
            font-weight: 900;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .aka-side .side-label { 
            color: var(--aka-color); 
            text-shadow: 0 0 8px rgba(255, 42, 42, 0.6);
        }
        .shiro-side .side-label { 
            color: var(--shiro-color); 
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
        }

        /* Nome do Atleta em grande destaque */
        .competitor-card input[type="text"] {
            width: 95%;
            padding: 12px;
            font-size: 1.8rem;
            font-weight: 800;
            text-align: center;
            border: 2px solid #555;
            border-radius: 8px;
            background: #0f141c;
            color: #ffffff;
            margin-bottom: 20px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.6);
        }

        .competitor-card input[type="text"]:focus {
            outline: none;
            border-color: var(--text-gold);
        }

        /* Contadores de Pontuação e Faltas */
        .section-title {
            font-size: 1.1rem;
            color: #ddd;
            text-transform: uppercase;
            margin-top: 15px;
            margin-bottom: 8px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
        }

        .btn {
            padding: 12px 18px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .btn:hover { transform: translateY(-2px); opacity: 0.9; }
        .btn:active { transform: translateY(0); }

        .btn-wazari { background-color: #ff9800; color: black; }
        .btn-ippon { background-color: #e53935; color: white; }
        .btn-chui { background-color: #fbc02d; color: black; }
        .btn-genten { background-color: #d32f2f; color: white; }

        /* Placa de pontuação */
        .display-box {
            font-size: 2.2rem;
            font-weight: 900;
            background: #000;
            padding: 12px 20px;
            border-radius: 8px;
            width: 90%;
            text-align: center;
            min-height: 45px;
            border: 2px solid #444;
            letter-spacing: 1px;
        }

        /* Seção Central (Cronômetro) */
        .timer-card {
            background-color: var(--panel-bg);
            border-radius: 16px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 6px 20px rgba(0,0,0,0.7);
            border: 2px solid #3a4750;
        }

        /* Cronômetro com máximo destaque */
        .timer-display {
            font-family: 'Courier New', Courier, monospace;
            font-size: 5rem;
            font-weight: 900;
            color: var(--text-gold);
            background: #000000;
            padding: 15px 25px;
            border-radius: 12px;
            border: 3px solid var(--text-gold);
            margin: 15px 0;
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.3);
            letter-spacing: 2px;
        }

        .timer-inputs {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }

        .timer-inputs input {
            width: 55px;
            padding: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            text-align: center;
            background: #0f141c;
            border: 1px solid #555;
            color: white;
            border-radius: 6px;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .btn-start { background-color: #2e7d32; color: white; width: 100%; font-size: 1.2rem; }
        .btn-pause { background-color: #ed6c02; color: white; width: 100%; font-size: 1.2rem; }
        .btn-reset { background-color: #616161; color: white; width: 100%; font-size: 1rem; }

        .match-duration {
            font-size: 1rem;
            color: #ccc;
            margin-top: 15px;
            text-align: center;
        }

        .match-duration strong {
            font-size: 1.5rem;
            color: #fff;
        }
    </style>
</head>
<body>

    <header>
        <h1>Miyamoto Damashii</h1>
        <div class="version-badge">Placar Oficial - Versão 1.1</div>
    </header>

    <div class="scoreboard">
        <!-- AKA (Vermelho) -->
        <div class="competitor-card aka-side">
            <div class="side-label">AKA (赤)</div>
            <input type="text" id="aka-name" placeholder="Nome do Atleta (Aka)" value="Atleta Aka">
            
            <div class="section-title">Pontuação</div>
            <div class="btn-group">
                <button class="btn btn-wazari" onclick="addScore('aka', 'wazari')">Waza-ari</button>
                <button class="btn btn-ippon" onclick="addScore('aka', 'ippon')">Ippon</button>
            </div>
            <div class="display-box" id="aka-score-display">---</div>

            <div class="section-title">Penalidades (Faltas)</div>
            <div class="btn-group">
                <button class="btn btn-chui" onclick="addFoul('aka', 'chui')">Chui</button>
                <button class="btn btn-genten" onclick="addFoul('aka', 'genten')">Genten</button>
            </div>
            <div class="display-box" id="aka-foul-display" style="font-size: 1.4rem;">Nenhuma</div>

            <button class="btn btn-reset" style="margin-top: 20px; font-size: 0.85rem;" onclick="resetCompetitor('aka')">Limpar Aka</button>
        </div>

        <!-- CRONÔMETRO CENTRAL -->
        <div class="timer-card">
            <div class="section-title" style="font-size: 1.3rem; color: #fff;">Tempo de Luta</div>
            <div class="timer-display" id="timer-display">03:00</div>

            <div class="timer-inputs">
                <label>Ajustar:</label>
                <input type="number" id="input-min" value="3" min="0" max="59"> m
                <input type="number" id="input-sec" value="0" min="0" max="59"> s
                <button class="btn" style="background:#3a4750; color:white; padding:8px 12px;" onclick="setCustomTime()">OK</button>
            </div>

            <div class="controls">
                <button class="btn btn-start" onclick="startTimer()">Iniciar</button>
                <button class="btn btn-pause" onclick="pauseTimer()">Pausar</button>
                <button class="btn btn-reset" onclick="resetTimer()">Reiniciar Cronômetro</button>
            </div>

            <div class="match-duration">
                Tempo Decorrido: <br><strong id="elapsed-display">00:00</strong>
            </div>
        </div>

        <!-- SHIRO (Branco) -->
        <div class="competitor-card shiro-side">
            <div class="side-label">SHIRO (白)</div>
            <input type="text" id="shiro-name" placeholder="Nome do Atleta (Shiro)" value="Atleta Shiro">
            
            <div class="section-title">Pontuação</div>
            <div class="btn-group">
                <button class="btn btn-wazari" onclick="addScore('shiro', 'wazari')">Waza-ari</button>
                <button class="btn btn-ippon" onclick="addScore('shiro', 'ippon')">Ippon</button>
            </div>
            <div class="display-box" id="shiro-score-display">---</div>

            <div class="section-title">Penalidades (Faltas)</div>
            <div class="btn-group">
                <button class="btn btn-chui" onclick="addFoul('shiro', 'chui')">Chui</button>
                <button class="btn btn-genten" onclick="addFoul('shiro', 'genten')">Genten</button>
            </div>
            <div class="display-box" id="shiro-foul-display" style="font-size: 1.4rem;">Nenhuma</div>

            <button class="btn btn-reset" style="margin-top: 20px; font-size: 0.85rem;" onclick="resetCompetitor('shiro')">Limpar Shiro</button>
        </div>
    </div>

    <script>
        // Estado da aplicação - Versão 1.1
        let timerInterval = null;
        let totalSeconds = 180; // 3 minutos padrão
        let initialSeconds = 180;
        let elapsedSeconds = 0;
        let isRunning = false;

        const state = {
            aka: { wazari: 0, ippon: 0, chui: 0, genten: 0 },
            shiro: { wazari: 0, ippon: 0, chui: 0, genten: 0 }
        };

        // Funções do Cronômetro
        function updateTimerDisplay() {
            const min = Math.floor(totalSeconds / 60);
            const sec = totalSeconds % 60;
            document.getElementById('timer-display').innerText = 
                `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;

            const elapMin = Math.floor(elapsedSeconds / 60);
            const elapSec = elapsedSeconds % 60;
            document.getElementById('elapsed-display').innerText = 
                `${String(elapMin).padStart(2, '0')}:${String(elapSec).padStart(2, '0')}`;
        }

        function setCustomTime() {
            pauseTimer();
            const min = parseInt(document.getElementById('input-min').value) || 0;
            const sec = parseInt(document.getElementById('input-sec').value) || 0;
            totalSeconds = (min * 60) + sec;
            initialSeconds = totalSeconds;
            elapsedSeconds = 0;
            updateTimerDisplay();
        }

        function startTimer() {
            if (isRunning || totalSeconds <= 0) return;
            isRunning = true;
            timerInterval = setInterval(() => {
                totalSeconds--;
                elapsedSeconds++;
                updateTimerDisplay();

                if (totalSeconds <= 0) {
                    pauseTimer();
                    alert("Tempo de luta encerrado!");
                }
            }, 1000);
        }

        function pauseTimer() {
            isRunning = false;
            clearInterval(timerInterval);
        }

        function resetTimer() {
            pauseTimer();
            totalSeconds = initialSeconds;
            elapsedSeconds = 0;
            updateTimerDisplay();
        }

        // Funções de Pontuação e Faltas
        function addScore(side, type) {
            if (type === 'wazari') {
                state[side].wazari++;
                if (state[side].wazari >= 2) {
                    state[side].ippon = 1; // Awasetewaza Ippon
                }
            } else if (type === 'ippon') {
                state[side].ippon = 1;
            }
            renderCompetitor(side);
        }

        function addFoul(side, type) {
            if (type === 'chui') {
                state[side].chui++;
                if (state[side].chui >= 2) {
                    state[side].genten += Math.floor(state[side].chui / 2);
                    state[side].chui = state[side].chui % 2;
                }
            } else if (type === 'genten') {
                state[side].genten++;
            }
            renderCompetitor(side);
        }

        function renderCompetitor(side) {
            // Render Pontos
            const scoreDisplay = document.getElementById(`${side}-score-display`);
            if (state[side].ippon > 0) {
                scoreDisplay.innerText = "IPPON!";
                scoreDisplay.style.color = "#ff2a2a";
            } else if (state[side].wazari > 0) {
                scoreDisplay.innerText = `WAZA-ARI (${state[side].wazari})`;
                scoreDisplay.style.color = "#ff9800";
            } else {
                scoreDisplay.innerText = "---";
                scoreDisplay.style.color = "white";
            }

            // Render Faltas
            const foulDisplay = document.getElementById(`${side}-foul-display`);
            let foulText = [];
            if (state[side].genten > 0) foulText.push(`Genten ${state[side].genten}`);
            if (state[side].chui > 0) foulText.push(`Chui ${state[side].chui}`);
            
            foulDisplay.innerText = foulText.length > 0 ? foulText.join(" | ") : "Nenhuma";
        }

        function resetCompetitor(side) {
            state[side] = { wazari: 0, ippon: 0, chui: 0, genten: 0 };
            renderCompetitor(side);
        }

        // Inicialização
        updateTimerDisplay();
    </script>
</body>
</html>
