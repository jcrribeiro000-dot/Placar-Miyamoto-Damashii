<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placar Miyamoto Damashii - v1.4</title>
    <style>
        :root {
            --bg-color: #08090c;
            --panel-bg: #141a22;
            --aka-color: #ff3333;
            --aka-bg: #2a0808;
            --shiro-color: #ffffff;
            --shiro-bg: #18222d;
            --text-gold: #ffcc00;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 10px;
            overflow: hidden;
        }

        /* HEADER & CONTROLES DO TEMPO NA PARTE SUPERIOR */
        header {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            background-color: var(--panel-bg);
            padding: 8px 20px;
            border-radius: 10px;
            border: 1px solid #2a3440;
            margin-bottom: 10px;
        }

        .header-title {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .header-title h1 {
            font-size: 1.3rem;
            letter-spacing: 2px;
            color: var(--text-gold);
            text-transform: uppercase;
        }

        .version-badge {
            font-size: 0.75rem;
            color: #888;
            font-weight: bold;
        }

        /* SEÇÃO DO CRONÔMETRO CENTRALIZADO E EXPANDIDO */
        .top-timer-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .timer-display {
            font-family: 'Courier New', Courier, monospace;
            font-size: 3.8rem;
            font-weight: 900;
            color: var(--text-gold);
            background: #000000;
            padding: 0px 22px;
            border-radius: 8px;
            border: 3px solid var(--text-gold);
            box-shadow: 0 0 20px rgba(255, 204, 0, 0.3);
            letter-spacing: 2px;
            line-height: 1.1;
        }

        .timer-controls-compact {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .btn-row {
            display: flex;
            gap: 6px;
        }

        .btn-compact {
            padding: 6px 12px;
            font-size: 0.85rem;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.15s ease;
        }

        .btn-compact:hover { opacity: 0.9; }

        .btn-start { background-color: #2e7d32; color: white; }
        .btn-pause { background-color: #ed6c02; color: white; }
        .btn-reset { background-color: #424242; color: white; }

        .timer-inputs-compact {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.8rem;
            color: #ccc;
        }

        .timer-inputs-compact input {
            width: 42px;
            padding: 3px 4px;
            font-size: 0.85rem;
            font-weight: bold;
            text-align: center;
            background: #0f141c;
            border: 1px solid #555;
            color: white;
            border-radius: 4px;
        }

        .elapsed-compact {
            font-size: 0.9rem;
            color: #aaa;
            text-align: right;
            justify-self: end;
        }

        .elapsed-compact strong {
            color: #fff;
            font-size: 1.1rem;
        }

        /* LAYOUT PRINCIPAL (SHIRO X AKA OCUPANDO 100% DA ÁREA ÚTIL) */
        .scoreboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            flex: 1;
            width: 100%;
        }

        .competitor-card {
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 6px 20px rgba(0,0,0,0.7);
        }

        /* SHIRO (ESQUERDA) E AKA (DIREITA) */
        .shiro-side {
            background-color: var(--shiro-bg);
            border: 5px solid var(--shiro-color);
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.15);
        }

        .aka-side {
            background-color: var(--aka-bg);
            border: 5px solid var(--aka-color);
            box-shadow: 0 0 25px rgba(255, 51, 51, 0.25);
        }

        .side-label {
            font-size: 3.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 4px;
            line-height: 1;
        }

        .shiro-side .side-label { 
            color: var(--shiro-color); 
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.8);
        }
        .aka-side .side-label { 
            color: var(--aka-color); 
            text-shadow: 0 0 12px rgba(255, 51, 51, 0.8);
        }

        .competitor-card input[type="text"] {
            width: 100%;
            padding: 6px;
            font-size: 2.2rem;
            font-weight: 900;
            text-align: center;
            border: 2px solid #555;
            border-radius: 8px;
            background: #0f141c;
            color: #ffffff;
            text-transform: uppercase;
        }

        /* DISPLAYS MAXIMIZADOS PARA VISUALIZAÇÃO A 6M+ */
        .display-section {
            width: 100%;
            text-align: center;
        }

        .section-label {
            font-size: 1.3rem;
            color: #bbb;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 4px;
        }

        .score-box {
            font-size: 5.5rem;
            font-weight: 900;
            background: #000000;
            color: #ffffff;
            padding: 10px;
            border-radius: 12px;
            width: 100%;
            text-align: center;
            border: 3px solid #444;
            line-height: 1;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: 0 0 10px rgba(255,255,255,0.2);
        }

        .foul-box {
            font-size: 3.2rem;
            font-weight: 900;
            background: #000000;
            color: #ff4444;
            padding: 8px;
            border-radius: 12px;
            width: 100%;
            text-align: center;
            border: 3px solid #444;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* BOTÕES OPERACIONAIS */
        .btn-group {
            display: flex;
            gap: 10px;
            width: 100%;
            margin-top: 6px;
        }

        .btn {
            flex: 1;
            padding: 10px 5px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s ease;
            text-transform: uppercase;
        }

        .btn:hover { opacity: 0.9; transform: scale(1.02); }
        .btn:active { transform: scale(0.98); }

        .btn-wazari { background-color: #ff9800; color: #000; }
        .btn-ippon { background-color: #e53935; color: #fff; }
        .btn-chui { background-color: #fbc02d; color: #000; }
        .btn-genten { background-color: #b71c1c; color: #fff; }
        .btn-clear { background-color: #3a4750; color: #fff; font-size: 0.8rem; padding: 6px; width: 100%; }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <h1>Miyamoto Damashii</h1>
            <div class="version-badge">Placar Oficial - v1.4</div>
        </div>

        <div class="top-timer-section">
            <div class="timer-display" id="timer-display">03:00</div>
            
            <div class="timer-controls-compact">
                <div class="btn-row">
                    <button class="btn-compact btn-start" onclick="startTimer()">Iniciar</button>
                    <button class="btn-compact btn-pause" onclick="pauseTimer()">Pausar</button>
                    <button class="btn-compact btn-reset" onclick="resetTimer()">Reset</button>
                </div>
                <div class="timer-inputs-compact">
                    <input type="number" id="input-min" value="3" min="0" max="59">m
                    <input type="number" id="input-sec" value="0" min="0" max="59">s
                    <button class="btn-compact" style="background:#3a4750; color:white; padding:3px 8px;" onclick="setCustomTime()">OK</button>
                </div>
            </div>
        </div>

        <div class="elapsed-compact">
            Decorrido:<br><strong id="elapsed-display">00:00</strong>
        </div>
    </header>

    <div class="scoreboard">
        <!-- SHIRO (BRANCO) - ESQUERDA -->
        <div class="competitor-card shiro-side">
            <div class="side-label">SHIRO (白)</div>
            <input type="text" id="shiro-name" placeholder="Nome do Atleta" value="Atleta Shiro">
            
            <div class="display-section">
                <div class="section-label">Pontuação</div>
                <div class="score-box" id="shiro-score-display">---</div>
                <div class="btn-group">
                    <button class="btn btn-wazari" onclick="addScore('shiro', 'wazari')">Waza-ari</button>
                    <button class="btn btn-ippon" onclick="addScore('shiro', 'ippon')">Ippon</button>
                </div>
            </div>

            <div class="display-section">
                <div class="section-label">Penalidades</div>
                <div class="foul-box" id="shiro-foul-display">NENHUMA</div>
                <div class="btn-group">
                    <button class="btn btn-chui" onclick="addFoul('shiro', 'chui')">Chui</button>
                    <button class="btn btn-genten" onclick="addFoul('shiro', 'genten')">Genten</button>
                </div>
            </div>

            <button class="btn btn-clear" onclick="resetCompetitor('shiro')">Limpar Shiro</button>
        </div>

        <!-- AKA (VERMELHO) - DIREITA -->
        <div class="competitor-card aka-side">
            <div class="side-label">AKA (赤)</div>
            <input type="text" id="aka-name" placeholder="Nome do Atleta" value="Atleta Aka">
            
            <div class="display-section">
                <div class="section-label">Pontuação</div>
                <div class="score-box" id="aka-score-display">---</div>
                <div class="btn-group">
                    <button class="btn btn-wazari" onclick="addScore('aka', 'wazari')">Waza-ari</button>
                    <button class="btn btn-ippon" onclick="addScore('aka', 'ippon')">Ippon</button>
                </div>
            </div>

            <div class="display-section">
                <div class="section-label">Penalidades</div>
                <div class="foul-box" id="aka-foul-display">NENHUMA</div>
                <div class="btn-group">
                    <button class="btn btn-chui" onclick="addFoul('aka', 'chui')">Chui</button>
                    <button class="btn btn-genten" onclick="addFoul('aka', 'genten')">Genten</button>
                </div>
            </div>

            <button class="btn btn-clear" onclick="resetCompetitor('aka')">Limpar Aka</button>
        </div>
    </div>

    <script>
        // Estado da aplicação - Versão 1.4
        let timerInterval = null;
        let totalSeconds = 180;
        let initialSeconds = 180;
        let elapsedSeconds = 0;
        let isRunning = false;

        const state = {
            shiro: { wazari: 0, ippon: 0, chui: 0, genten: 0 },
            aka: { wazari: 0, ippon: 0, chui: 0, genten: 0 }
        };

        // Funções do Cronômetro
        function updateTimerDisplay() {
            const min = Math.floor(totalSeconds / 60);
            const sec = totalSeconds % 60;
            document.getElementById('timer-display').innerText = 
                `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;

            const elapMin = Math.floor(elapsedSeconds / 60);
            const elapSec = elapsedSeconds % 60;
            document.getElementById('elapsed-display').innerText = 
                `${String(elapMin).padStart(2, '0')}:${String(elapSec).padStart(2, '0')}`;
        }

        function setCustomTime() {
            pauseTimer();
            const min = parseInt(document.getElementById('input-min').value) || 0;
            const sec = parseInt(document.getElementById('input-sec').value) || 0;
            totalSeconds = (min * 60) + sec;
            initialSeconds = totalSeconds;
            elapsedSeconds = 0;
            updateTimerDisplay();
        }

        function startTimer() {
            if (isRunning || totalSeconds <= 0) return;
            isRunning = true;
            timerInterval = setInterval(() => {
                totalSeconds--;
                elapsedSeconds++;
                updateTimerDisplay();

                if (totalSeconds <= 0) {
                    pauseTimer();
                    alert("Tempo de luta encerrado!");
                }
            }, 1000);
        }

        function pauseTimer() {
            isRunning = false;
            clearInterval(timerInterval);
        }

        function resetTimer() {
            pauseTimer();
            totalSeconds = initialSeconds;
            elapsedSeconds = 0;
            updateTimerDisplay();
        }

        // Funções de Pontuação e Faltas
        function addScore(side, type) {
            if (type === 'wazari') {
                state[side].wazari++;
                if (state[side].wazari >= 2) {
                    state[side].ippon = 1; // Awasetewaza Ippon
                }
            } else if (type === 'ippon') {
                state[side].ippon = 1;
            }
            renderCompetitor(side);
        }

        function addFoul(side, type) {
            if (type === 'chui') {
                state[side].chui++;
                if (state[side].chui >= 2) {
                    state[side].genten += Math.floor(state[side].chui / 2);
                    state[side].chui = state[side].chui % 2;
                }
            } else if (type === 'genten') {
                state[side].genten++;
            }
            renderCompetitor(side);
        }

        function renderCompetitor(side) {
            // Render Pontos
            const scoreDisplay = document.getElementById(`${side}-score-display`);
            if (state[side].ippon > 0) {
                scoreDisplay.innerText = "IPPON";
                scoreDisplay.style.color = "#ff3333";
            } else if (state[side].wazari > 0) {
                scoreDisplay.innerText = `WAZA-ARI (${state[side].wazari})`;
                scoreDisplay.style.color = "#ff9800";
            } else {
                scoreDisplay.innerText = "---";
                scoreDisplay.style.color = "#ffffff";
            }

            // Render Faltas
            const foulDisplay = document.getElementById(`${side}-foul-display`);
            let foulText = [];
            if (state[side].genten > 0) foulText.push(`GENTEN ${state[side].genten}`);
            if (state[side].chui > 0) foulText.push(`CHUI ${state[side].chui}`);
            
            if (foulText.length > 0) {
                foulDisplay.innerText = foulText.join(" | ");
                foulDisplay.style.color = "#ff4444";
            } else {
                foulDisplay.innerText = "NENHUMA";
                foulDisplay.style.color = "#555555";
            }
        }

        function resetCompetitor(side) {
            state[side] = { wazari: 0, ippon: 0, chui: 0, genten: 0 };
            renderCompetitor(side);
        }

        // Inicialização
        updateTimerDisplay();
    </script>
</body>
</html>
